<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew Moore Jr.</title>
<meta name="description" content="Matthew Moore Jr. — walk around my apartment, play a few games, and say hello.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141a26'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%23f2b441' font-family='Georgia' font-weight='bold'>M</text></svg>">
<style>
  :root{
    --ink:#f4efe6; --dim:#b9b2a5; --bg:#0d1118; --glass:rgba(16,21,31,.88);
    --line:rgba(255,255,255,.12); --amber:#f2b441; --green:#35c27a; --red:#e5544b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none !important}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:var(--amber)}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  #start{background:radial-gradient(1200px 700px at 50% 30%,#1b2333 0%,#0d1118 60%)}
  #start .card{max-width:560px;text-align:center}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(34px,6vw,58px);margin:0 0 6px;letter-spacing:.01em}
  .sub{color:var(--dim);font-size:16px;margin:0 0 26px}
  .btn{background:var(--amber);color:#1a1303;border:0;border-radius:999px;padding:13px 28px;font-weight:700;font-size:16px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
  .btn.small{padding:8px 16px;font-size:14px}
  .keys{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin:26px 0 0;color:var(--dim);font-size:13.5px}
  kbd{display:inline-block;min-width:24px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:var(--ink);font:600 12px ui-monospace,Menlo,monospace;text-align:center}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  #pause{background:rgba(6,8,12,.55);cursor:pointer;text-align:center}
  #pause p{font-size:20px;font-weight:600;margin:0}
  #pause small{display:block;color:var(--dim);margin-top:8px}

  #panel{background:rgba(6,8,12,.6);backdrop-filter:blur(3px)}
  #panel .box{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:18px;
    width:min(680px,100%);max-height:92vh;overflow:auto;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #panel h2{font-family:Georgia,serif;font-size:26px;margin:0 0 4px}
  #panel p{color:var(--dim);line-height:1.5;margin:6px 0 14px}
  #back{position:absolute;top:16px;right:16px}
  .hint{color:var(--dim);font-size:12.5px;margin-top:16px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  input,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;color:var(--ink);font:inherit}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:1px}

  .games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  @media (max-width:640px){.games{grid-template-columns:1fr}}
  .game{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.04);display:flex;flex-direction:column}
  .game h3{margin:0 0 4px;font-size:16px}
  .game p{font-size:13px;margin:0 0 10px;flex:1}
  .board{list-style:none;margin:10px 0 0;padding:0;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .board li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .board li b{color:var(--ink);font-weight:600}
  .board .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);opacity:.8}
  .big{font-family:Georgia,serif;font-size:44px;color:var(--amber);margin:6px 0 2px}

  .cv{border-left:2px solid var(--amber);padding-left:14px;margin:14px 0}
  .cv div{margin:8px 0;line-height:1.4}
  .cv span{display:block;color:var(--dim);font-size:13px}

  /* paper airplane */
  #plane{position:fixed;left:50%;top:55%;font-size:44px;z-index:40;pointer-events:none;opacity:0}
  #plane.fly{animation:fly 1.25s cubic-bezier(.3,.1,.3,1) forwards}
  @keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
    60%{opacity:1}
    100%{opacity:0;transform:translate(60vw,-70vh) rotate(-28deg) scale(.4)}}
  @media (prefers-reduced-motion:reduce){#plane.fly{animation-duration:.01s}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);opacity:.85}
  #cross.hot{background:var(--amber);transform:scale(1.7)}
  #prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
  #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
    padding:9px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s}
  #toast.show{opacity:1}
  #clickhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
    padding:7px 14px;border-radius:999px;font-size:13.5px}
  #controls{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--line);
    border-radius:16px;padding:18px 24px;text-align:center;opacity:0;transition:opacity .9s ease;line-height:2;font-size:15px;white-space:nowrap}
  #controls.show{opacity:1;transition:opacity .3s ease}
  #controls b{display:block;font:700 20px Georgia,serif;margin-bottom:4px}
  #ghud{position:absolute;inset:0}
  .g-top{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:10px;font-variant-numeric:tabular-nums}
  .pill{background:var(--glass);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap}
  .g-msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font:700 30px Georgia,serif;text-shadow:0 2px 10px #000;white-space:nowrap;text-align:center}
  .g-msg small{display:block;font:500 15px ui-sans-serif,system-ui,sans-serif;margin-top:6px;opacity:.9}
  .g-band{position:relative;width:320px;height:12px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid var(--line)}
  .g-band span{position:absolute;top:0;bottom:0;background:rgba(53,194,122,.75)}
  .g-band i{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:#fff;border-radius:2px}
  .g-bar.hot i{background:var(--green)} .g-bar b{position:absolute;right:0;top:0;bottom:0;width:15%;border-left:2px solid rgba(255,255,255,.7)}
  .g-exit{position:absolute;left:16px;top:14px;color:rgba(255,255,255,.75);font-size:12.5px;text-shadow:0 1px 3px #000}
  .g-bar{position:absolute;left:50%;bottom:60px;position:absolute;transform:translateX(-50%);width:260px;height:12px;border-radius:8px;
    background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
  .g-bar i{display:block;height:100%;background:var(--amber)}
  .g-side{position:absolute;right:16px;top:60px;background:var(--glass);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;font:13px/1.7 ui-monospace,Menlo,monospace;min-width:190px}
  .g-wind{position:absolute;left:16px;top:44px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:13px ui-monospace,Menlo,monospace}
  .g-wind b{color:var(--amber)}
  .g-clubs{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:flex;gap:5px}
  .g-clubs span{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:600 12.5px ui-monospace,Menlo,monospace;color:var(--dim)}
  .g-clubs span.on{background:var(--amber);color:#1a1303;border-color:var(--amber)}
  .g-prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
  .g-tip{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:12.5px;text-shadow:0 1px 3px #000;white-space:nowrap}
  .g-bar.golf{width:340px;height:16px;bottom:48px;overflow:visible} .g-bar.golf i{border-radius:8px}
  .g-bar.golf u{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  #key{position:fixed;z-index:30;left:50%;top:44%;width:190px;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
    transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1),width .9s cubic-bezier(.5,0,.2,1),transform .5s ease,opacity .3s ease;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
  #key.pop{opacity:1;transform:translate(-50%,-50%) scale(1)} #key.pop svg{animation:keyspin 1.5s ease-in-out}
  #key.dock{opacity:1;left:16px;top:calc(100% - 52px);width:64px;transform:none}
  @keyframes keyspin{0%{transform:rotateY(0) scale(.4)}60%{transform:rotateY(720deg) scale(1.15)}100%{transform:rotateY(720deg) scale(1)}}
  input.ini{width:120px;text-transform:uppercase;letter-spacing:.35em;text-align:center;font:700 20px ui-monospace,Menlo,monospace}
  b.ini{color:var(--amber);letter-spacing:.2em;font-family:ui-monospace,Menlo,monospace;font-size:18px;margin-left:4px}
  table.card{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;margin:8px 0 4px}
  table.card td,table.card th{border:1px solid var(--line);padding:5px 4px;text-align:center;font-weight:500}
  table.card th{color:var(--dim);font-weight:600;text-align:left;padding-left:8px}
  .under{color:var(--green)} .over{color:var(--red)}
  .g-plaque{position:absolute;left:16px;bottom:16px;background:var(--glass);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;font:12.5px/1.7 ui-monospace,Menlo,monospace;color:var(--dim)}
  .g-plaque b{color:var(--ink)}
  .up{color:var(--green)} .down{color:var(--red)}

  /* ---------- eyes / blackout ---------- */
  .lid{position:fixed;left:0;right:0;height:0;background:#000;z-index:15;pointer-events:none}
  #lidT{top:0} #lidB{bottom:0}
  #black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:16;transition:opacity 1.6s ease}

  /* ---------- lite page ---------- */
  #lite{background:radial-gradient(900px 600px at 50% 20%,#1b2333 0%,#0d1118 65%);overflow:auto}
  #lite .card{max-width:440px;width:100%;text-align:center}
  #lite .links{display:grid;gap:10px;margin:22px 0}
  #lite .links a{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;background:rgba(255,255,255,.04);font-weight:600}
  #lite .links a span{display:block;color:var(--dim);font-weight:400;font-size:13px;margin-top:2px;overflow-wrap:anywhere}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="cross"></div>
  <div id="prompt" class="hidden"></div>
  <div id="toast"></div>
  <div id="clickhint" class="hidden">Click to look around</div>
  <div id="controls"></div>
  <div id="ghud" class="hidden"></div>
</div>

<div class="lid" id="lidT"></div><div class="lid" id="lidB"></div>
<div id="black"></div>
<div id="plane">✈️</div>
<div id="key" aria-hidden="true"><svg viewBox="0 0 120 60"><g fill="none" stroke="#f2b441" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="30" r="15"/><path d="M39 30h68M88 30v16M104 30v12"/></g><circle cx="24" cy="30" r="5" fill="#0d1118"/></svg></div>

<div id="pause" class="overlay hidden"><div><p>Paused</p><small>Click anywhere to keep going</small><button class="btn ghost small hidden" id="homeBtn" style="margin-top:18px">Back to home</button></div></div>

<div id="panel" class="overlay hidden">
  <div class="box">
    <button class="btn ghost small" id="back">Back to world</button>
    <div id="panelBody"></div>
    <div class="hint">Press <kbd>E</kbd> or <kbd>Esc</kbd> to go back</div>
  </div>
</div>

<div id="lite" class="overlay hidden">
  <div class="card">
    <h1>Matthew Moore Jr.</h1>
    <p class="sub">Say hello.</p>
    <div class="links">
      <a href="mailto:mmoore@college.harvard.edu">Email<span>mmoore@college.harvard.edu</span></a>
      <a href="https://www.linkedin.com/in/matthew-moore-b4b3ba327" target="_blank" rel="noopener">LinkedIn<span>linkedin.com/in/matthew-moore-b4b3ba327</span></a>
      <a href="https://www.instagram.com/matthew.moore04/" target="_blank" rel="noopener">Instagram<span>@matthew.moore04</span></a>
    </div>
    <p class="sub" id="liteNote" style="margin-top:14px;font-size:13px"></p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
